<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sakura Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        .ai-selector { padding: 6px; border-bottom: 1px solid #2d2740; }
        .ai-selector select { width: 100%; background: #1a1626; color: #d4d4d4; border: 1px solid #2d2740; border-radius: 4px; padding: 4px; }
        #ai-frame { flex: 1; width: 100%; border: none; background: #12101a; }
    </style>
</head>
<body>
    <div id="titlebar">
        <span id="app-title">
            <img id="sakura-logo" src="../public/Sakura.png" alt="">
            <span class="tb-letters"><span class="tb-letter">S</span><span class="tb-letter">a</span><span class="tb-letter">k</span><span class="tb-letter">u</span><span class="tb-letter">r</span><span class="tb-letter">a</span></span>
        </span>
        <div id="titlebar-buttons"><button id="btn-toggle-ai">AI</button></div>
    </div>

    <div id="workspace">
        <div id="terminal-container"></div>
        <div id="pane-divider"></div>
        <div id="ai-pane">
            <div class="ai-selector">
                <select id="ai-choice">
                    <option value="lumo">Lumo AI</option>
                    <option value="deepseek">DeepSeek</option>
                </select>
            </div>
            <webview id="ai-frame" src="https://lumo.proton.me" allowpopups></webview>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
